name: Verify Windows installer
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to test
        required: true
        type: string
      candidate:
        description: For a staged build, the Git blob ID and SHA-256 separated by a colon
        required: false
        type: string
permissions:
  contents: read
jobs:
  verify:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Download the release candidate
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
          CANDIDATE_HASHES: ${{ inputs.candidate }}
        run: |
          if ($env:RELEASE_TAG -notmatch '^v\d+\.\d+\.\d+$') { throw 'Use a numeric release tag.' }
          $file = 'UsageMonitor-' + $env:RELEASE_TAG.Substring(1) + '-windows-x64.msi'
          if ($env:CANDIDATE_HASHES) {
            if ($env:CANDIDATE_HASHES -notmatch '^([0-9a-f]{40}):([0-9a-f]{64})$') { throw 'Invalid candidate hashes.' }
            $blob, $expected = $Matches[1], $Matches[2]
            $path = Join-Path $env:RUNNER_TEMP $file
            $url = "https://api.github.com/repos/$env:GITHUB_REPOSITORY/git/blobs/$blob"
            Invoke-WebRequest -Uri $url -Headers @{Accept='application/vnd.github.raw+json'} -OutFile $path
            if ((Get-FileHash -LiteralPath $path).Hash -ne $expected) { throw 'Installer checksum differs.' }
          } else {
            gh release download $env:RELEASE_TAG --repo $env:GITHUB_REPOSITORY --pattern $file --dir $env:RUNNER_TEMP
            if ($LASTEXITCODE) { exit $LASTEXITCODE }
          }
          "CANDIDATE=$env:RUNNER_TEMP\$file" >> $env:GITHUB_ENV
      - name: Test install, upgrade and removal in a fresh Windows account
        shell: powershell
        run: ./tests/test-install.ps1 -Installer $env:CANDIDATE
